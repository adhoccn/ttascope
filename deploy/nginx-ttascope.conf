    # >>> ttascope begin（deploy/install.sh 维护的区间，勿手改；改模板后重跑 install.sh）
    # ── TTAScope：挂在已有站点的 /tta/ 子路径下，避免新增安全组端口 ──
    # limit_req/conn 的 zone 定义在同目录 nginx-ttascope-limits.conf（http 级）。
    # proxy_pass 结尾的 / 会把 /tta/ 前缀剥掉，后端看到的是 / 与 /api/...

    # 检测接口单独一个 location：前缀更长优先匹配，用更严格的桶。
    # CPU 密集且单 worker，rate=2r/s + burst=10 足够一次点击（含交叉对照
    # 的第二次请求与报告导出的重取），连点脚本会被挡住。
    location /tta/api/ {
        __AUTH_OFF__
        proxy_pass http://127.0.0.1:__PORT__/api/;

        limit_req  zone=tta_api  burst=10  nodelay;
        limit_req_status 429;
        limit_conn tta_conn 6;
        # 文本经浏览器本地解析后才 POST 上来，8 MB 远超正常批次
        client_max_body_size 8m;
        # 超限返回 JSON 而不是默认 HTML 错误页，前端才有 detail 可显示
        error_page 429 = @tta429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    location /tta/ {
        __AUTH_OFF__
        proxy_pass http://127.0.0.1:__PORT__/;

        limit_req zone=tta_page burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @tta429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    location = /tta { return 301 /tta/; }

    # 429 兜底：named location 不能被外部请求，只由 error_page 内部跳转进来
    location @tta429 {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"detail":"请求过于频繁，已达限流上限（检测接口 2 次/秒、突发 10；单 IP 并发 6），请稍候重试"}';
    }
    # <<< ttascope end
