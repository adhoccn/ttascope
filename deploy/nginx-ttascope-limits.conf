# TTAScope 限流区定义（http 级，需放在 /etc/nginx/conf.d/ 下由主配置 include）
#
#   sudo cp deploy/nginx-ttascope-limits.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#
# zone 必须定义在 http 上下文，不能在 server/location 里，因此单独立一个文件。
# 主配置 /etc/nginx/nginx.conf 里 `include /etc/nginx/conf.d/*.conf;` 位于 http 块，
# 直接放进去即可生效。

# 页面与静态资源：宽松，够正常刷新即可
limit_req_zone  $binary_remote_addr  zone=tta_page:10m  rate=10r/s;
# 检测接口：检测是 CPU 密集（单 worker），按 IP 严格限
limit_req_zone  $binary_remote_addr  zone=tta_api:10m   rate=2r/s;

# 单 IP 并发连接数，防止并发刷接口把单 worker 拖死
limit_conn_zone $binary_remote_addr  zone=tta_conn:10m;

# 超限统一返回 429，而不是默认 503：语义清晰，前端可据此提示"稍后再试"
limit_req_status  429;
limit_conn_status 429;
